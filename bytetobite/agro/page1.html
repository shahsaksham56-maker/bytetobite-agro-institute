<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteToBite — Seller / Kisan Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="db.js"></script>
    <script src="ocr.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <style>
        @font-face {
            font-family: 'TT Norms Pro';
            src: url('/fonts/tt-norms-pro-regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'TT Norms Pro';
            src: url('/fonts/tt-norms-pro-semibold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #F5F5F5;
            font-family: 'TT Norms Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            font-family: inherit;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .marquee-track {
            display: flex;
            width: max-content;
            animation: marquee 22s linear infinite;
        }

        .marquee-track:hover {
            animation-play-state: paused;
        }

        @keyframes backers-marquee {
            0% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .backers-track {
            display: flex;
            width: max-content;
            animation: backers-marquee 30s linear infinite;
        }

        .backers-track:hover {
            animation-play-state: paused;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.55;
            }

            70% {
                transform: scale(2.6);
                opacity: 0;
            }

            100% {
                transform: scale(2.6);
                opacity: 0;
            }
        }

        @keyframes drawer-in {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0%);
            }
        }

        .drawer-in {
            animation: drawer-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes kyc-fade-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .kyc-fade-in {
            animation: kyc-fade-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulse-slow {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.9;
            }
        }

        .pulse-slow {
            animation: pulse-slow 2.4s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-top-color: #000;
            border-radius: 999px;
            animation: spin 0.7s linear infinite;
        }

        .leaflet-container {
            background: #0c0f09;
            font-family: 'Inter', sans-serif;
        }

        .leaflet-popup-content-wrapper {
            background: #14170e;
            color: #fff;
            border-radius: 12px;
        }

        .leaflet-popup-tip {
            background: #14170e;
        }

        .leaflet-popup-content {
            margin: 12px 14px;
            font-size: 13px;
            line-height: 1.5;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: rgba(255, 255, 255, 0.6);
        }

        .origin-marker {
            position: relative;
            width: 18px;
            height: 18px;
        }

        .origin-marker .dot {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #4ade80;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
        }

        .origin-marker .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: #4ade80;
            animation: pulse-ring 2.2s ease-out infinite;
        }

        .buyer-marker {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: #ffffff;
            border: 2px solid #14170e;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body class="bg-[#F5F5F5]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;

        // ==========================================
        // ICONS
        // ==========================================
        const ArrowRight = ({ className = "w-5 h-5 text-black" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
            </svg>
        );

        const CameraIcon = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
            </svg>
        );

        const GaugeIcon = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 20a8 8 0 1 0-8-8" />
                <path d="M12 12 16 8" />
                <path d="M12 2v2M2 12h2M20 12h2" />
            </svg>
        );

        const CloseIcon = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M18 6 6 18M6 6l12 12" />
            </svg>
        );

        const CheckIcon = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20 6 9 17l-5-5" />
            </svg>
        );

        const HomeIcon = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        );

        const ShieldIcon = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
        );

        const PinIcon = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
            </svg>
        );

        const ClockIcon = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
            </svg>
        );

        const TrashIcon = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
        );

        // ==========================================
        // CONSTANTS
        // ==========================================
        const CATEGORIES = [
            'MUSHROOM_SUBSTRATE',
            'CITRUS_POMACE',
            'SILICA_SAND',
            'PLANT_FIBER',
            'COOKED_SURPLUS',
            'BIO_MASS',
            'OTHER'
        ];

        const DEFAULT_ORIGIN = { lat: 30.1453, lng: 74.1994, label: 'Locating you…' };

        const GRADING = {
            MUSHROOM_SUBSTRATE: { moisture: 22.5, rate: 2.10, subType: 'Spent Substrate Block' },
            CITRUS_POMACE: { moisture: 14.2, rate: 3.50, subType: 'Orange Peels (Pectin Extraction Grade)' },
            SILICA_SAND: { moisture: 3.8, rate: 1.40, subType: 'Foundry-Grade Reject Sand' },
            PLANT_FIBER: { moisture: 11.6, rate: 2.80, subType: 'Sugarcane Bagasse' },
            COOKED_SURPLUS: { moisture: 68.0, rate: 4.20, subType: 'Mandi Canteen Surplus' },
            BIO_MASS: { moisture: 26.4, rate: 1.90, subType: 'Mixed Crop Residue' },
            OTHER: { moisture: 20.0, rate: 2.00, subType: 'Farmer-described waste' }
        };

        // ==========================================
        // HELPERS
        // ==========================================
        const money = (n) => `₹${(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        const statusStyle = (status) => {
            switch (status) {
                case 'ESCROW LOCKED': return 'bg-black text-white';
                case 'MATCHED': return 'bg-black/10 text-black';
                case 'OPEN': return 'bg-amber-100 text-amber-800';
                default: return 'bg-black/[0.06] text-black/50';
            }
        };

        const statusLabel = (status) => {
            switch (status) {
                case 'ESCROW LOCKED': return 'Money locked';
                case 'MATCHED': return 'Buyer matched';
                case 'OPEN': return 'Waiting for buyer';
                default: return status;
            }
        };

        function haversineKm(a, b) {
            const R = 6371;
            const dLat = (b.lat - a.lat) * Math.PI / 180;
            const dLng = (b.lng - a.lng) * Math.PI / 180;
            const lat1 = a.lat * Math.PI / 180;
            const lat2 = b.lat * Math.PI / 180;
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(h));
        }
        // ==========================================
        // NAVBAR
        // ==========================================
        const Navbar = ({ onOpenLedger, kycVerified, origin, locating }) => (
            <nav className="absolute top-0 left-0 right-0 z-20 px-3 sm:px-6 py-3 sm:py-5">
                <div className="max-w-[88rem] mx-auto flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2 sm:gap-6">
                        <a href="hero.html" className="inline-flex items-center gap-1.5 text-black/80 hover:text-black font-semibold text-xs sm:text-sm bg-white/80 hover:bg-white border border-black/10 px-3 py-1.5 rounded-full shadow-sm transition-all whitespace-nowrap">
                            <HomeIcon className="w-3.5 h-3.5" />
                            <span>Back to Main</span>
                        </a>
                    </div>
                    <div className="flex items-center gap-2 sm:gap-3 flex-wrap justify-end">
                        <div className="hidden md:flex items-center gap-2 rounded-full border border-black/10 bg-white/70 backdrop-blur px-3 py-1.5 text-xs sm:text-sm">
                            <PinIcon className={`w-3.5 h-3.5 ${locating ? 'text-black/40 animate-pulse' : 'text-black/70'}`} />
                            <span className="text-black/70 truncate max-w-[140px] sm:max-w-[200px]">
                                {locating ? 'Finding you…' : origin.label}
                            </span>
                        </div>
                        <div className={`flex items-center gap-1.5 sm:gap-2 rounded-full border px-2.5 sm:px-3 py-1 sm:py-1.5 backdrop-blur text-xs ${kycVerified ? 'border-black/10 bg-white/70' : 'border-red-200 bg-red-50/70'}`}>
                            <ShieldIcon className={`w-3.5 h-3.5 ${kycVerified ? 'text-black/70' : 'text-red-500'}`} />
                            <span className="text-black/70">
                                KYC <span className={`font-medium ${kycVerified ? 'text-black' : 'text-red-600'}`}>
                                    {kycVerified ? 'Verified' : 'Not Verified'}
                                </span>
                            </span>
                        </div>
                        <button onClick={onOpenLedger} className="bg-black text-white text-xs sm:text-sm font-medium px-3 sm:px-5 py-1.5 sm:py-2 rounded-full hover:bg-gray-800 transition-colors whitespace-nowrap shadow-sm">
                            Escrow Ledger
                        </button>
                    </div>
                </div>
            </nav>
        );

        // ==========================================
        // KYC VERIFICATION MODAL
        // ==========================================
        const KYCVerification = ({ onVerified }) => {
            const [aadhaar, setAadhaar] = useState('');
            const [farmerId, setFarmerId] = useState('');
            const [landRecord, setLandRecord] = useState('');
            const [mobile, setMobile] = useState('');
            const [otp, setOtp] = useState('');
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.shiftKey && (e.key === 'D' || e.key === 'd')) {
                        e.preventDefault();
                        onVerified();
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [onVerified]);

            const DEV_BYPASS = aadhaar.trim() === '000000000000' || farmerId.trim().toLowerCase() === 'dev' || mobile.trim() === '0000000000';
            const validAadhaar = DEV_BYPASS || aadhaar.replace(/\s/g, '').length === 12;
            const validFarmerId = DEV_BYPASS || farmerId.trim().length >= 8;
            const validLand = DEV_BYPASS || landRecord.trim().length >= 5;
            const validMobile = DEV_BYPASS || mobile.replace(/\D/g, '').length === 10;
            const validOtp = DEV_BYPASS || otp.length === 6;

            const handleSendOtp = () => {
                if (!validAadhaar || !validFarmerId || !validLand || !validMobile) {
                    setError('Please fill all details correctly');
                    return;
                }
                setError('');
                setLoading(true);
                setTimeout(() => { setLoading(false); setStep(2); }, 1200);
            };

            const handleVerify = () => {
                if (!validOtp) {
                    setError('Please enter the 6-digit code');
                    return;
                }
                setError('');
                setLoading(true);
                setTimeout(() => { setLoading(false); onVerified(); }, 1500);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto" style={{ background: 'radial-gradient(circle at 30% 20%, #3a4a2f 0%, #1d2417 45%, #0c0f09 100%)' }}>
                    <div className="absolute inset-0 opacity-[0.08]" style={{ backgroundImage: 'repeating-linear-gradient(135deg, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 1px, transparent 1px, transparent 26px)' }}></div>
                    <div className="relative w-full max-w-lg kyc-fade-in my-auto py-6">
                        <div className="flex justify-between items-center mb-3">
                            <a href="hero.html" className="inline-flex items-center gap-1.5 text-xs text-white/80 hover:text-white bg-white/10 hover:bg-white/20 border border-white/15 px-3 py-1.5 rounded-full transition-colors">
                                ← Back to Main
                            </a>
                            <button type="button" onClick={() => onVerified()} className="inline-flex items-center gap-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-400/40 text-xs font-semibold px-3 py-1.5 rounded-full transition-colors">
                                ⚡ Login for Demo
                            </button>
                        </div>
                        <div className="rounded-3xl border border-white/10 bg-white/[0.06] backdrop-blur-2xl p-6 sm:p-10 shadow-2xl">
                            <div className="text-center mb-6 sm:mb-8">
                                <div className="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-white/10 border border-white/20 flex items-center justify-center mx-auto mb-3 sm:mb-4">
                                    <ShieldIcon className="w-6 h-6 sm:w-7 sm:h-7 text-white/80" />
                                </div>
                                <h2 className="text-white text-2xl sm:text-3xl font-medium mb-2" style={{ letterSpacing: '-0.03em' }}>Verify Your KYC</h2>
                                <p className="text-white/50 text-xs sm:text-sm leading-relaxed">To sell your farm waste, we need to confirm you are a real farmer. This keeps everyone safe.</p>
                            </div>

                            {step === 1 && (
                                <div className="space-y-3.5 sm:space-y-4">
                                    <div>
                                        <label className="text-white/60 text-xs font-medium uppercase tracking-wider mb-1.5 block">Aadhaar Number</label>
                                        <input type="text" value={aadhaar} onChange={(e) => setAadhaar(e.target.value)} placeholder="12-digit Aadhaar number" maxLength={14} className="w-full bg-white/[0.06] border border-white/15 rounded-xl px-4 py-3 text-white placeholder-white/25 text-sm sm:text-base focus:outline-none focus:border-white/40 transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-white/60 text-xs font-medium uppercase tracking-wider mb-1.5 block">Farmer ID (11-digit)</label>
                                        <input type="text" value={farmerId} onChange={(e) => setFarmerId(e.target.value)} placeholder="From your PM-Kisan registration" className="w-full bg-white/[0.06] border border-white/15 rounded-xl px-4 py-3 text-white placeholder-white/25 text-sm sm:text-base focus:outline-none focus:border-white/40 transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-white/60 text-xs font-medium uppercase tracking-wider mb-1.5 block">Land Record Number</label>
                                        <input type="text" value={landRecord} onChange={(e) => setLandRecord(e.target.value)} placeholder="From your land papers (7/12, Khatauni)" className="w-full bg-white/[0.06] border border-white/15 rounded-xl px-4 py-3 text-white placeholder-white/25 text-sm sm:text-base focus:outline-none focus:border-white/40 transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-white/60 text-xs font-medium uppercase tracking-wider mb-1.5 block">Mobile Number</label>
                                        <input type="tel" value={mobile} onChange={(e) => setMobile(e.target.value)} placeholder="10-digit mobile linked to Aadhaar" maxLength={10} className="w-full bg-white/[0.06] border border-white/15 rounded-xl px-4 py-3 text-white placeholder-white/25 text-sm sm:text-base focus:outline-none focus:border-white/40 transition-colors" />
                                    </div>
                                    {error && <p className="text-red-300 text-xs sm:text-sm text-center">{error}</p>}
                                    <button onClick={handleSendOtp} disabled={loading} className="w-full bg-white text-black font-medium rounded-xl py-3.5 sm:py-4 text-sm sm:text-base hover:bg-gray-200 transition-colors disabled:opacity-50">
                                        {loading ? 'Sending OTP...' : 'Send OTP to Mobile'}
                                    </button>
                                    <div className="pt-1">
                                        <button type="button" onClick={() => onVerified()} className="w-full py-2.5 px-4 rounded-xl border border-emerald-400/40 bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
                                            <span>⚡ Login for Demo (Skip KYC)</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-4">
                                    <div className="text-center mb-2">
                                        <p className="text-white/60 text-sm">We sent a 6-digit code to <span className="text-white">+91 {mobile}</span></p>
                                    </div>
                                    <div>
                                        <label className="text-white/60 text-xs font-medium uppercase tracking-wider mb-2 block">Enter OTP</label>
                                        <input type="text" value={otp} onChange={(e) => setOtp(e.target.value.replace(/\D/g, '').slice(0, 6))} placeholder="6-digit code" maxLength={6} className="w-full bg-white/[0.06] border border-white/15 rounded-xl px-5 py-3.5 text-white placeholder-white/25 text-base text-center tracking-[0.5em] focus:outline-none focus:border-white/40 transition-colors" />
                                    </div>
                                    {error && <p className="text-red-300 text-sm text-center">{error}</p>}
                                    <button onClick={handleVerify} disabled={loading} className="w-full bg-white text-black font-medium rounded-xl py-4 text-base hover:bg-gray-200 transition-colors disabled:opacity-50">
                                        {loading ? 'Verifying...' : 'Verify & Start Selling'}
                                    </button>
                                    <button type="button" onClick={() => onVerified()} className="w-full py-2.5 px-4 rounded-xl border border-emerald-400/40 bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
                                        <span>⚡ Login for Demo (Skip Verification)</span>
                                    </button>
                                    <button onClick={() => { setStep(1); setOtp(''); setError(''); }} className="w-full text-white/40 text-sm hover:text-white/70 transition-colors py-2">
                                        Go back
                                    </button>
                                </div>
                            )}

                            <p className="text-white/25 text-xs text-center mt-6 leading-relaxed">Your details are safe. We only use them to verify your identity.</p>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // CATEGORY MARQUEE
        // ==========================================
        const CategoryMarquee = () => {
            const displayCats = CATEGORIES.filter(c => c !== 'OTHER');
            return (
                <div className="mt-10 w-full max-w-md overflow-hidden select-none">
                    <div className="marquee-track flex items-center">
                        {[...displayCats, ...displayCats].map((c, i) => (
                            <span key={i} className="mx-7 shrink-0 text-white/50 whitespace-nowrap text-sm tracking-tight">

            const mapRef = useRef(null);
            const containerRef = useRef(null);
            const originRef = useRef(origin);
            const buyerLayerRef = useRef(null);
            const originLayerRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current || !window.L) return;
                const L = window.L;

                if (!mapRef.current) {
                    const map = L.map(containerRef.current, { zoomControl: true, attributionControl: true })
                        .setView([origin.lat, origin.lng], 10);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; OpenStreetMap &copy; CARTO',
                        subdomains: 'abcd',
                        maxZoom: 19
                    }).addTo(map);
                    originLayerRef.current = L.layerGroup().addTo(map);
                    buyerLayerRef.current = L.layerGroup().addTo(map);
                    mapRef.current = map;
                    setTimeout(() => map.invalidateSize(), 200);
                }

                const map = mapRef.current;
                if (originLayerRef.current) originLayerRef.current.clearLayers();
                if (buyerLayerRef.current) buyerLayerRef.current.clearLayers();

                // 50km radius circle
                L.circle([origin.lat, origin.lng], {
                    radius: 50000,
                    color: '#4ade80',
                    weight: 1.5,
                    fillColor: '#4ade80',
                    fillOpacity: 0.08,
                    dashArray: '4 6'
                }).addTo(originLayerRef.current);

                    className: '',
                    html: '<div class="origin-marker"><div class="ring"></div><div class="dot"></div></div>',
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });
                L.marker([origin.lat, origin.lng], { icon: originIcon })
                    .addTo(originLayerRef.current)
                    .bindPopup(`<strong>${origin.label}</strong><br/>Your pickup point`);

                // Buyer markers
                const buyerIcon = L.divIcon({
                    className: '',
                    html: '<div class="buyer-marker"></div>',
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });
                buyersWithDistance.forEach((b) => {

                        .addTo(buyerLayerRef.current)
                        .bindPopup(`<strong>${b.name}</strong><br/>${b.distance.toFixed(1)} km away<br/>Buys: ${(b.accepts || []).join(', ')}<br/>Needs: ${b.demand || '—'}`);
                });

                if (originRef.current.lat !== origin.lat || originRef.current.lng !== origin.lng) {

                    originRef.current = origin;

                                        <div key={b.name} className="flex items-center justify-between rounded-xl border border-black/[0.06] px-4 py-3 text-sm">
                                            <span className="text-black/80">{b.name}</span>

                                    ))}

                        <div className="rounded-3xl overflow-hidden" style={{ height: 520 }}>

            return (
                <div className="fixed inset-0 z-30 pointer-events-none">
                    <div className="drawer-in pointer-events-auto absolute top-0 right-0 h-full w-full max-w-md bg-white border-l border-black/10 shadow-2xl flex flex-col">
                        <div className="flex items-center justify-between px-7 py-6 border-b border-black/[0.06]">
                            <h3 className="text-xl font-medium" style={{ letterSpacing: '-0.02em' }}>Money held safely</h3>
                            <button onClick={onClose} className="w-9 h-9 rounded-full bg-black/[0.06] flex items-center justify-center hover:bg-black/10 transition-colors">
                                <CloseIcon className="w-4 h-4" />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto px-7 py-6 space-y-6">
                            <div className="rounded-2xl p-6" style={{ backgroundColor: '#2B2644' }}>
                                <p className="text-white/60 text-sm mb-2">Total money locked</p>
                                <p className="text-white text-4xl font-medium" style={{ letterSpacing: '-0.03em' }}>{money(totalValue)}</p>
                            </div>

                            <div className="rounded-2xl border border-black/[0.06] p-5">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-medium">30% advance</span>
                                    <span className="font-medium">{money(advance)}</span>
                                </div>
                                <p className="text-black/50 text-sm">Paid when truck picks up your waste</p>
                            </div>

                            <div className="rounded-2xl border border-black/[0.06] p-5">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-medium">70% balance</span>
                                    <span className="font-medium">{money(balance)}</span>
                                </div>
                                <p className="text-black/50 text-sm">Paid when factory checks the weight</p>
                            </div>

                            <div>
                                <p className="text-black/50 text-sm mb-3">Each lot breakdown</p>
                                {lots.length === 0 ? (
                                    <p className="text-black/40 text-sm">No lots yet.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {lots.map((l) => (
                                            <div key={l.id} className="rounded-2xl border border-black/[0.06] p-5">
                                                <div className="flex items-center justify-between mb-3">
                                                    <span className="font-medium text-base">{l.id}</span>
                                                    <span className="text-black/50 text-sm">
                                                        {l.category === 'OTHER' ? (l.otherText || 'Other') : (l.category || '').replaceAll('_', ' ')}
                                                    </span>
                                                </div>
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-medium ${statusStyle(l.status)}`}>
                                                        {statusLabel(l.status)}
                                                    </span>
                                                    <span className="px-3 py-1 rounded-full text-xs font-medium bg-black/[0.06] text-black/60">
                                                        {money((l.massKg || 0) * (l.rate || 0) * 0.3)} advance
                                                    </span>
                                                    <span className="px-3 py-1 rounded-full text-xs font-medium bg-black/[0.06] text-black/60">
                                                        {money((l.massKg || 0) * (l.rate || 0) * 0.7)} balance
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP
        // ==========================================
        const App = () => {
            const [kycVerified, setKycVerified] = useState(() => new URLSearchParams(window.location.search).get('dev') === '1');
            const [origin, setOrigin] = useState(DEFAULT_ORIGIN);
            const [locating, setLocating] = useState(true);
            const [lot, setLot] = useState({ photoName: null, moisture: null, massKg: null, category: null, subType: null, rate: null, graded: false });
            const [otherText, setOtherText] = useState('');
            const [openForBarter, setOpenForBarter] = useState(false);
            const [wantedCategory, setWantedCategory] = useState('BIO_MASS');
            const [wantedMassKg, setWantedMassKg] = useState(0);
            const [scanning, setScanning] = useState(false);
            const [grading, setGrading] = useState(false);
            const [published, setPublished] = useState(false);
            const [ledgerOpen, setLedgerOpen] = useState(false);
            const [activeLots, setActiveLots] = useState([]);
            const [allBuyers, setAllBuyers] = useState([]);
            const [ocrRaw, setOcrRaw] = useState('');
            const [ocrConfidence, setOcrConfidence] = useState(0);
            const [ocrProgress, setOcrProgress] = useState(0);
            const [ocrStage, setOcrStage] = useState('');
            const fileRef = useRef(null);

            // ---- GPS ----
            useEffect(() => {
                if (!navigator.geolocation) { setLocating(false); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        setOrigin({ lat: latitude, lng: longitude, label: `Lat ${latitude.toFixed(3)}, Lng ${longitude.toFixed(3)}` });
                        setLocating(false);
                    },
                    (err) => { console.warn('Geolocation error:', err.message); setLocating(false); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
                );
                const watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        setOrigin({ lat: latitude, lng: longitude, label: `Lat ${latitude.toFixed(3)}, Lng ${longitude.toFixed(3)}` });
                    },
                    () => { },
                    { enableHighAccuracy: true, maximumAge: 30000 }
                );
                return () => { if (watchId !== undefined) navigator.geolocation.clearWatch(watchId); };
            }, []);

            // ---- Live subscription to DB ----
            useEffect(() => {
                (async () => {
                    try {
                        if (window.ByteToBiteAPI) {
                            const lots = await window.ByteToBiteAPI.getLots();
                            setActiveLots(lots.sort((a, b) => b.createdAt - a.createdAt));
                            const buyers = await window.ByteToBiteAPI.getAllBuyers();
                            setAllBuyers(buyers);
                        }
                    } catch (e) { console.warn('Initial load failed:', e); }
                })();

                let unsub = () => { };
                if (window.ByteToBiteAPI) {
                    unsub = window.ByteToBiteAPI.subscribe(async () => {
                        try {
                            const lots = await window.ByteToBiteAPI.getLots();
                            setActiveLots(lots.sort((a, b) => b.createdAt - a.createdAt));
                            const buyers = await window.ByteToBiteAPI.getAllBuyers();
                            setAllBuyers(buyers);
                        } catch (e) { console.warn('Refresh failed:', e); }
                    });
                }
                return () => unsub();
            }, []);

            // ---- Step derivation ----
            const step = !lot.photoName ? 1 : !lot.graded ? 2 : 3;

            // ---- File upload → real OCR ----
            const onFile = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                setPublished(false);
                setLot((l) => ({ ...l, photoName: file.name, graded: false, moisture: null, massKg: null, rate: null }));
                setScanning(true);
                setOcrProgress(0);
                setOcrStage('Opening slip…');
                try {
                    if (!window.ByteToBiteOCR) throw new Error('OCR module not loaded');
                    setOcrStage('Reading text from slip…');
                    const result = await window.ByteToBiteOCR.readSlip(file);
                    setOcrRaw(result.rawText || '');
                    setOcrConfidence(result.confidence || 0);
                    setLot((l) => ({
                        ...l,
                        massKg: result.weightKg || l.massKg,
                        ocrDate: result.date,
                        ocrMandi: result.mandiName,
                        ocrTrader: result.traderName,
                        ocrReady: true
                    }));
                    setOcrStage('Done reading');
                } catch (err) {
                    console.warn('OCR failed:', err);
                    setOcrRaw('Slip could not be read. Please enter weight manually.');
                    setOcrConfidence(0);
                } finally {
                    setScanning(false);
                    setOcrStage('');
                }
            };

            // ---- Auto-grade (apply deterministic grading to detected category) ----
            const onAutoGrade = () => {
                if (!lot.photoName || scanning) return;
                setGrading(true);
                setTimeout(() => {
                    const category = lot.category || 'CITRUS_POMACE';
                    const g = GRADING[category];
                    const finalMass = lot.massKg || Math.round(400 + Math.random() * 900);
                    setLot((l) => ({ ...l, category, moisture: g.moisture, massKg: finalMass, rate: g.rate, subType: g.subType, graded: true }));
                    setGrading(false);
                }, 600);
            };

            // ---- Publish (real save to IndexedDB) ----
            const onPublish = async () => {
                if (!lot.graded || published) return;
                setPublished(true);

                const nearbyBuyers = allBuyers
                    .map(b => ({ ...b, distance: haversineKm(origin, b) }))
                    .filter(b => b.distance <= 50 && (!b.accepts || b.accepts.includes(lot.category) || lot.category === 'OTHER'))
                    .sort((a, b) => a.distance - b.distance);
                const buyer = nearbyBuyers[0] || null;

                const newLotRecord = {
                    id: 'LOT-' + Date.now().toString().slice(-6),
                    category: lot.category,
                    otherText: lot.category === 'OTHER' ? otherText : null,
                    massKg: lot.massKg,
                    moisture: lot.moisture,
                    rate: lot.rate,
                    origin: origin.label,
                    lat: origin.lat,
                    lng: origin.lng,
                    matchedBuyer: buyer ? buyer.name : null,
                    transporter: buyer ? 'Truck assigned · pickup code sent' : null,
                    status: buyer ? 'ESCROW LOCKED' : 'OPEN',
                    createdAt: Date.now(),
                    openForBarter: openForBarter,
                    wantedCategory: openForBarter ? wantedCategory : null,
                    wantedMassKg: openForBarter ? wantedMassKg : null
                };

                try {
                    if (window.ByteToBiteAPI) await window.ByteToBiteAPI.publishLot(newLotRecord);
                } catch (err) { console.warn('Save failed:', err); }

                setActiveLots((prev) => [newLotRecord, ...prev]);

                // Reset form after publish
                setTimeout(() => {
                    setLot({ photoName: null, moisture: null, massKg: null, category: null, subType: null, rate: null, graded: false });
                    setOtherText('');
                    setOcrRaw('');
                    setOcrConfidence(0);
                    setPublished(false);
                    setOpenForBarter(false);
                    setWantedCategory('BIO_MASS');
                    setWantedMassKg(0);
                }, 1500);
            };

            // ---- Delete lot ----
            const onDelete = async (id) => {
                setActiveLots((prev) => prev.filter((l) => l.id !== id));
                try {
                    if (window.ByteToBiteAPI && window.ByteToBiteAPI.deleteLot) {
                        await window.ByteToBiteAPI.deleteLot(id);
                    }
                } catch (e) { console.warn('Delete failed:', e); }
            };

            const buyersWithDistance = useMemo(
                () => allBuyers.map(b => ({ ...b, distance: haversineKm(origin, b) })).sort((a, b) => a.distance - b.distance),
                [allBuyers, origin]
            );

            return (
                <div className="flex flex-col bg-[#F5F5F5] min-h-screen relative">
                    <div className={`transition-all duration-500 ${!kycVerified ? 'blur-2xl pointer-events-none select-none' : ''}`}>
                        <div className="min-h-screen flex flex-col relative overflow-x-hidden">
                            <Navbar onOpenLedger={() => setLedgerOpen(true)} kycVerified={kycVerified} origin={origin} locating={locating} />
                            <HeroSection
                                lot={lot}
                                step={step}
                                scanning={scanning}
                                onFile={onFile}
                                onAutoGrade={onAutoGrade}
                                onPublish={onPublish}
                                grading={grading}
                                published={published}
                                fileRef={fileRef}
                                origin={origin}
                                locating={locating}
                                ocrProgress={ocrProgress}
                                ocrStage={ocrStage}
                            />
                        </div>

                        <TelemetrySection
                            lot={lot}
                            setLot={setLot}
                            canEditCategory={!lot.graded}
                            otherText={otherText}
                            setOtherText={setOtherText}
                            ocrRaw={ocrRaw}
                            ocrConfidence={ocrConfidence}
                            openForBarter={openForBarter}
                            setOpenForBarter={setOpenForBarter}
                            wantedCategory={wantedCategory}
                            setWantedCategory={setWantedCategory}
                            wantedMassKg={wantedMassKg}
                            setWantedMassKg={setWantedMassKg}
                        />

                        <ActiveLotsTable lots={activeLots} onDelete={onDelete} />

                        <WaitingRoom lots={activeLots} buyers={allBuyers} origin={origin} locating={locating} />

                        <MapPanel origin={origin} buyersWithDistance={buyersWithDistance} locating={locating} />
                    </div>

                    {!kycVerified && <KYCVerification onVerified={() => setKycVerified(true)} />}

                    <EscrowDrawer open={ledgerOpen} onClose={() => setLedgerOpen(false)} lots={activeLots} />
                </div>
            );
        };

        // ==========================================
        // RENDER
        // ==========================================
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>

</html>
