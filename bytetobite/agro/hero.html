<body class="bg-[#0C0C0C] text-[#D7E2EA] selection:bg-white selection:text-black">
    <div id="root"></div>
    <script
        type="text/babel">const { useState, useEffect, useRef } = React; const { motion, useScroll, useTransform } = Motion; const ArrowRight = ({ className = "w-4 h-4" }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>); const Truck = ({ className = "w-4 h-4" }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="3" width="15" height="13" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>); const AtelierHeroSection = () => { const [isMenuOpen, setIsMenuOpen] = useState(false); useEffect(() => { if (isMenuOpen) { document.body.style.overflow = "hidden" } else { document.body.style.overflow = "" } return () => { document.body.style.overflow = "" } }, [isMenuOpen]); const navLinks = [{ name: "Buyer Hub", href: "page2.html" }, { name: "Kisan / Seller Portal", href: "page1.html" }, { name: "Logistics Console", href: "page3.html" }, { name: "Wildlife Relief Grid", href: "page4.html" }, { name: "Bio-Compost Hub", href: "page5.html" }, { name: "Eco-Store", href: "page6.html" }]; const mobileLinks = [{ name: "Buyer Hub", href: "page2.html" }, { name: "Kisan / Seller Portal", href: "page1.html" }, { name: "Logistics Console", href: "page3.html" }, { name: "Wildlife Relief Grid", href: "page4.html" }, { name: "Bio-Compost Hub", href: "page5.html" }, { name: "Eco-Store", href: "page6.html" }]; return (<section className="relative w-full min-h-screen pb-10 sm:pb-0 sm:h-screen overflow-hidden bg-black font-sans"><video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none brightness-75" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204103_f607742e-09da-4cf5-bb06-4e67b0a531de.mp4" /><div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60 z-0 pointer-events-none" /><div className="relative z-10 flex flex-col h-full w-full justify-between"><nav className="flex items-center justify-between gap-4 px-4 sm:px-6 md:px-12 lg:px-16 py-4 sm:py-5 md:py-6 w-full"><div className="flex items-center gap-6 lg:gap-8 flex-wrap"><div className="flex items-center gap-2 sm:gap-3 select-none whitespace-nowrap"><span className="text-yellow-400 font-semibold text-sm sm:text-base tracking-tight font-sans">ByteToBite Agro</span><span className="text-white/30 text-sm sm:text-base font-light">/</span><a href="../institutional/institutional.html" className="text-white/60 hover:text-white font-semibold text-sm sm:text-base tracking-tight font-sans transition-colors duration-200 whitespace-nowrap">ByteToBite Institutional</a></div><div className="hidden md:flex items-center space-x-5 lg:space-x-6">{navLinks.map((item) => (<a key={item.name} href={item.href} className="text-white/80 hover:text-white text-xs lg:text-sm font-light transition-colors duration-200 whitespace-nowrap">{item.name}</a>))}</div></div><div className="flex items-center gap-4 lg:gap-6 flex-shrink-0"><div className="hidden md:flex items-center space-x-5 lg:space-x-6"><a href="#connect" className="text-white/80 hover:text-white text-xs lg:text-sm font-light transition-colors duration-200 whitespace-nowrap">Connect Us</a><a href="#expertise" className="text-white/80 hover:text-white text-xs lg:text-sm font-light transition-colors duration-200 whitespace-nowrap">Services</a></div><button onClick={() => setIsMenuOpen(!isMenuOpen)} aria-label="Toggle navigation menu" className="md:hidden relative w-8 h-8 flex flex-col justify-center items-end gap-1.5 focus:outline-none z-50 cursor-pointer"><span className={`block h-[2px] bg-white rounded-full transition-all duration-500 [transition-timing-function:cubic-bezier(0.76,0,0.24,1)] ${isMenuOpen ? "w-6 -rotate-45 translate-y-2" : "w-6"}`} /><span className={`block h-[2px] bg-white rounded-full transition-all duration-500 [transition-timing-function:cubic-bezier(0.76,0,0.24,1)] ${isMenuOpen ? "w-0 opacity-0" : "w-4 opacity-100"}`} /><span className={`block h-[2px] bg-white rounded-full transition-all duration-500 [transition-timing-function:cubic-bezier(0.76,0,0.24,1)] ${isMenuOpen ? "w-6 rotate-45 -translate-y-2" : "w-6"}`} /></button></div></nav><div className="flex-1 flex flex-col items-center justify-center pt-2 sm:pt-6 md:pt-8 px-4 sm:px-6 text-center my-auto"><h1 className="font-instrument-serif text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl leading-[1.1] max-w-5xl tracking-normal">TURNING AGRO-WASTE <span className="italic font-instrument-serif">into</span><br />HIGH-VALUE <span className="italic font-instrument-serif">bio</span> ASSETS</h1><p className="mt-3 sm:mt-4 md:mt-5 text-white/70 text-xs sm:text-sm md:text-base font-light max-w-xl leading-relaxed">Autonomous multi-agent grid routing farm byproduct and institutional surplus to industrial converters, NGOs, and bio-digesters before kinetic thermal decay.</p><div className="mt-4 sm:mt-5 md:mt-6 flex flex-col sm:flex-row items-center gap-3 sm:gap-4 w-full sm:w-auto"><a href="page1.html" className="group flex items-center justify-center gap-2 bg-white text-black font-medium text-xs sm:text-sm rounded-full px-6 sm:px-7 py-2.5 sm:py-3 transition-transform duration-200 active:scale-95 w-full sm:w-auto"><span>List Farm Waste (Kisan Portal)</span><span className="transform transition-transform duration-200 group-hover:translate-x-1"><ArrowRight className="w-4 h-4" /></span></a><a href="page3.html" className="group flex items-center justify-center gap-2.5 bg-transparent border border-white/40 text-white rounded-full px-6 sm:px-7 py-2.5 sm:py-3 text-xs sm:text-sm font-medium hover:bg-white/10 hover:border-white/60 transition-all duration-200 w-full sm:w-auto"><Truck className="w-4 h-4 stroke-current opacity-90 text-white" /><span>Transporter / Driver Fleet Console</span></a></div></div></div><div className={`fixed inset-0 z-50 md:hidden flex flex-col justify-between p-6 sm:p-8 bg-black/90 backdrop-blur-xl transition-all duration-700 [transition-timing-function:cubic-bezier(0.76,0,0.24,1)] ${isMenuOpen ? "opacity-100 pointer-events-auto visible" : "opacity-0 pointer-events-none invisible"}`}><div className="flex items-center justify-between w-full"><div className="flex items-center gap-2 select-none"><span className="text-yellow-400 font-semibold text-base sm:text-lg tracking-tight font-sans">ByteToBite Agro</span><span className="text-white/30 text-base sm:text-lg font-light">/</span><a href="../institutional/institutional.html" className="text-white/60 hover:text-white font-semibold text-base sm:text-lg tracking-tight font-sans transition-colors duration-200">ByteToBite Institutional</a></div><button onClick={() => setIsMenuOpen(false)} aria-label="Close menu" className="w-8 h-8 flex flex-col justify-center items-center gap-1.5 focus:outline-none cursor-pointer"><span className="block w-6 h-[2px] bg-white rounded-full -rotate-45 translate-y-[4px] transition-transform duration-300" /><span className="block w-6 h-[2px] bg-white rounded-full rotate-45 -translate-y-[4px] transition-transform duration-300" /></button></div><div className="flex flex-col justify-center my-auto w-full">{mobileLinks.map((item, idx) => (<a key={item.name} href={item.href} onClick={() => setIsMenuOpen(false)} style={{ transitionDelay: isMenuOpen ? `${150 + idx * 80}ms` : "0ms" }} className={`text-2xl sm:text-3xl font-instrument-serif text-white py-3 sm:py-4 border-b border-white/10 transition-all duration-500 [transition-timing-function:cubic-bezier(0.76,0,0.24,1)] hover:pl-4 text-left ${isMenuOpen ? "opacity-100 translate-y-0" : "opacity-0 translate-y-8"}`}>{item.name}</a>))}</div><div style={{ transitionDelay: isMenuOpen ? "550ms" : "0ms" }} className={`w-full transition-all duration-500 [transition-timing-function:cubic-bezier(0.76,0,0.24,1)] ${isMenuOpen ? "opacity-100 translate-y-0" : "opacity-0 translate-y-4"}`}><a href="page1.html" onClick={() => setIsMenuOpen(false)} className="flex items-center justify-center w-full bg-white text-black font-medium text-base rounded-full py-3.5 text-center hover:bg-white/90 transition-colors">Mandi Intake</a></div></div></section>) }; const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = "", as = "div" }) => { const MotionComponent = motion[as] || motion.div; return (<MotionComponent initial={{ opacity: 0, x, y }} whileInView={{ opacity: 1, x: 0, y: 0 }} viewport={{ once: true, margin: "50px", amount: 0 }} transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }} className={className}>{children}</MotionComponent>) }; const ContactButton = ({ className = "" }) => { const [isOpen, setIsOpen] = useState(false); const ref = useRef(null); useEffect(() => { const handleClickOutside = (e) => { if (ref.current && !ref.current.contains(e.target)) { setIsOpen(false); } }; document.addEventListener("mousedown", handleClickOutside); return () => document.removeEventListener("mousedown", handleClickOutside); }, []); return (<div ref={ref} className="relative inline-block"><button onClick={() => setIsOpen(!isOpen)} className={`contact-btn-glow inline-flex items-center justify-center rounded-full text-white font-medium uppercase tracking-widest transition-transform hover:scale-105 active:scale-95 duration-200 px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base ${className}`}>Connect Us</button>{isOpen && (<div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 flex flex-col gap-2 bg-black/95 backdrop-blur-lg border border-white/20 rounded-2xl p-2 min-w-[180px] z-50 shadow-2xl"><a href="mailto:hello@bytetobite.com" className="px-4 py-2 text-white/80 hover:text-white hover:bg-white/10 rounded-xl transition-colors text-sm text-center">Email</a><a href="https://instagram.com/bytetobite" target="_blank" rel="noopener noreferrer" className="px-4 py-2 text-white/80 hover:text-white hover:bg-white/10 rounded-xl transition-colors text-sm text-center">Instagram</a></div>)}</div>) }; const AnimatedChar = ({ char, progress, range }) => { const opacity = useTransform(progress, range, [0.2, 1]); return (<span className="relative inline-block"><span className="opacity-0">{char === " " ? "\u00A0" : char}</span><motion.span style={{ opacity }} className="absolute inset-0">{char === " " ? "\u00A0" : char}</motion.span></span>) }; const AnimatedText = ({ text, className = "" }) => { const targetRef = useRef(null); const { scrollYProgress } = useScroll({ target: targetRef, offset: ["start 0.8", "end 0.2"] }); const words = text.split(" "); let charIndex = 0; const totalChars = text.length; return (<p ref={targetRef} className={`text-center ${className}`}>{words.map((word, wi) => (<span key={wi} className="inline-block whitespace-nowrap">{Array.from(word).map((char, ci) => { const start = charIndex / totalChars; const end = (charIndex + 1) / totalChars; charIndex++; return (<AnimatedChar key={ci} char={char} progress={scrollYProgress} range={[start, end]} />) })}<span className="inline-block">&nbsp;</span></span>))}</p>) }; const MARQUEE_ROW1 = ["video1.mp4", "video2.mp4", "video3.mp4", "video4.mp4"]; const MARQUEE_ROW2 = ["video5.mp4", "video6.mp4", "video7.mp4", "video8.mp4"]; const MarqueeSection = () => { const sectionRef = useRef(null); const [offset, setOffset] = useState(0); const videoRefs = useRef([]); useEffect(() => { const handleScroll = () => { if (!sectionRef.current) return; const rect = sectionRef.current.getBoundingClientRect(); const sectionTop = window.scrollY + rect.top; const currentOffset = (window.scrollY - sectionTop + window.innerHeight) * 0.3; setOffset(currentOffset) }; window.addEventListener("scroll", handleScroll, { passive: true }); handleScroll(); return () => window.removeEventListener("scroll", handleScroll) }, []); const handleVideoTap = (index) => { const video = videoRefs.current[index]; if (!video) return; if (video.muted) { video.muted = false; video.play(); } else { video.muted = true; } }; const row1 = [...MARQUEE_ROW1, ...MARQUEE_ROW1, ...MARQUEE_ROW1]; const row2 = [...MARQUEE_ROW2, ...MARQUEE_ROW2, ...MARQUEE_ROW2]; return (<section ref={sectionRef} className="bg-[#0C0C0C] pt-20 sm:pt-28 md:pt-40 pb-10 overflow-hidden flex flex-col gap-3"><div className="flex gap-3 will-change-transform" style={{ transform: `translateX(${offset - 200}px)` }}>{row1.map((url, i) => (<div key={`r1-${i}`} className="w-[280px] sm:w-[360px] md:w-[420px] h-[180px] sm:h-[230px] md:h-[270px] flex-shrink-0 relative rounded-2xl overflow-hidden"><video ref={(el) => { videoRefs.current[i] = el; }} src={url} autoPlay loop muted playsInline onClick={() => handleVideoTap(i)} className="w-full h-full object-cover cursor-pointer" /></div>))}</div><div className="flex gap-3 will-change-transform" style={{ transform: `translateX(${-(offset - 200)}px)` }}>{row2.map((url, i) => (<div key={`r2-${i}`} className="w-[280px] sm:w-[360px] md:w-[420px] h-[180px] sm:h-[230px] md:h-[270px] flex-shrink-0 relative rounded-2xl overflow-hidden"><video ref={(el) => { videoRefs.current[row1.length + i] = el; }} src={url} autoPlay loop muted playsInline onClick={() => handleVideoTap(row1.length + i)} className="w-full h-full object-cover cursor-pointer" /></div>))}</div></section>) }; const AboutSection = () => { const bio = "ByteToBite is a two-vertical circular agro valorization grid. Campus kitchens forecast meals, cook to demand, count plates live, check freshness, and dispatch surplus to nearby NGOs. Farmers list byproducts on a PostGIS-matched marketplace with escrow and QC; anything that fails becomes compost feedstock. One shared backend, one live grid, two closed loops."; return (<section id="studio" className="relative min-h-screen flex flex-col items-center justify-center px-5 sm:px-8 md:px-10 py-20 overflow-hidden text-center"><div className="relative z-20 flex flex-col items-center max-w-4xl mx-auto"><FadeIn delay={0} y={40}><h2 className="hero-heading font-black uppercase leading-none tracking-tight text-[clamp(3rem,12vw,160px)]">Our Grid</h2></FadeIn><div className="mt-10 sm:mt-14 md:mt-16 mb-16 sm:mb-20 md:mb-24 w-full"><AnimatedText text={bio} className="text-[#D7E2EA] font-medium leading-relaxed text-[clamp(1rem,2vw,1.35rem)]" /></div><FadeIn delay={0.2} y={30}><ContactButton /></FadeIn></div></section>) }; const SERVICES = [{ num: "01", title: "Food rescue", desc: "Surplus campus meals reach nearby NGOs before they spoil. The system forecasts demand, tracks prep, counts plates live, checks freshness, and matches the batch to the closest NGO with capacity. Every plate rescued is logged with CO₂, water, and value saved." }, { num: "02", title: "Byproduct marketplace", desc: "Farmers and FPOs sell crop waste to nearby industries through a PostGIS-matched marketplace. Buyers post standing orders, farmers list lots with photo, moisture, and GPS, and deals close with milestone escrow — 30% advance locked on match, 70% released on gate QC." }, { num: "03", title: "Compost valorization", desc: "Lots that fail QC, get contamination-flagged, or expire past shelf life are auto-diverted to the compost hub. Operators produce compost and biomethane, each batch gets a SHA-256 certificate, and the finished compost returns to the same farms. Expired institutional food joins the same stream." }, { num: "04", title: "Wildlife relief", desc: "Time-critical, contamination-flagged, or unsafe-for-human lots are offered to zoos and sanctuaries within a short radius before they're composted. Relief grids register species and animal counts, so the system matches each lot to a suitable recipient. Keeps food out of the bin and feeds animals that would otherwise need purchased feed." }, { num: "05", title: "Eco-Store", desc: "Farmers and artisans sell finished bio-materials — mycelium leather, compost, biomass briquettes, artisan goods — direct to consumers. Every product carries a carbon-saved figure and a link back to the raw byproduct it came from. Orders are paid through Razorpay, and every sale writes to the same grid that tracked the original waste stream." }]; const ServicesSection = () => { return (<section id="expertise" className="bg-[#FFFFFF] text-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32 relative z-0"><FadeIn delay={0} y={30}><h2 className="font-black uppercase text-center text-[#0C0C0C] text-[clamp(3rem,12vw,160px)] leading-none mb-16 sm:mb-20 md:mb-28">Services</h2></FadeIn><div className="max-w-5xl mx-auto flex flex-col">{SERVICES.map((s, i) => (<FadeIn key={s.num} delay={i * 0.1} className="flex flex-col md:flex-row md:items-center justify-between py-8 sm:py-10 md:py-12 border-b border-[#0C0C0C]/15 gap-4 md:gap-12"><div className="font-black text-[#0C0C0C] leading-none text-[clamp(3rem,10vw,140px)] select-none">{s.num}</div><div className="flex-1 flex flex-col justify-center"><h3 className="font-medium uppercase text-[clamp(1rem,2.2vw,2.1rem)] text-[#0C0C0C] mb-2">{s.title}</h3><p className="font-light leading-relaxed max-w-2xl text-[clamp(0.85rem,1.6vw,1.25rem)] text-[#0C0C0C]/60">{s.desc}</p></div></FadeIn>))}</div></section>) }; const PROJECTS = [{ id: "01", name: "Cooked Food Surplus → NGO Meals", category: "Food Rescue", img1: "project1-1.jpg", img2: "project1-2.jpg", img3: "project1-3.jpg" }, { id: "02", name: "Byproducts & Crop Residue → Industrial Raw Material", category: "Byproduct Marketplace", img1: "project2-1.jpg", img2: "project2-2.jpg", img3: "project2-3.jpg" }, { id: "03", name: "Failed Lots & Expired Food → Compost & Biomethane", category: "Compost Valorization", img1: "project3-1.jpg", img2: "project3-2.jpg", img3: "project3-3.jpg" }]; const ProjectCard = ({ project, index, totalCards, progress, range }) => { const targetScale = 1 - (totalCards - 1 - index) * 0.03; const scale = useTransform(progress, range, [1, targetScale]); return (<div className="min-h-[70vh] sm:h-[85vh] flex items-start justify-center sticky top-20 sm:top-24 md:top-32"><motion.div style={{ scale, top: `${index * 24}px` }} className="w-full relative rounded-[32px] sm:rounded-[50px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:p-6 md:p-8 flex flex-col gap-4 sm:gap-6"><div className="flex flex-wrap items-center justify-between gap-4"><div className="flex items-baseline gap-3 sm:gap-6"><span className="font-black text-white leading-none text-[clamp(2rem,7vw,100px)]">{project.id}</span><span className="text-[#D7E2EA]/60 uppercase tracking-widest text-xs sm:text-sm font-medium no-break">[{project.category}]</span><h4 className="text-white uppercase font-medium text-[clamp(0.95rem,2vw,1.8rem)]">{project.name}</h4></div></div><div className="grid grid-cols-1 md:grid-cols-10 gap-4 flex-1 items-stretch"><div className="md:col-span-4 flex flex-col gap-4"><div className="h-[clamp(130px,16vw,230px)] w-full overflow-hidden rounded-[24px] sm:rounded-[40px] md:rounded-[60px]"><img src={project.img1} alt={`${project.name} preview 1`} className="w-full h-full object-cover" loading="lazy" /></div><div className="h-[clamp(160px,22vw,340px)] w-full overflow-hidden rounded-[24px] sm:rounded-[40px] md:rounded-[60px]"><img src={project.img2} alt={`${project.name} preview 2`} className="w-full h-full object-cover" loading="lazy" /></div></div><div className="md:col-span-6 h-[220px] sm:h-[290px] md:h-auto overflow-hidden rounded-[24px] sm:rounded-[40px] md:rounded-[60px]"><img src={project.img3} alt={`${project.name} preview 3`} className="w-full h-full object-cover" loading="lazy" /></div></div></motion.div></div>) }; const ProjectsSection = () => { const containerRef = useRef(null); const { scrollYProgress } = useScroll({ target: containerRef, offset: ["start start", "end end"] }); return (<section id="projects" ref={containerRef} className="relative z-10 -mt-10 sm:-mt-12 md:-mt-14 bg-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 pt-16 pb-32"><FadeIn delay={0} y={30} className="mb-14 sm:mb-20"><h2 className="hero-heading font-black uppercase text-center text-[clamp(3rem,12vw,160px)] leading-none">Valorization</h2></FadeIn><div className="max-w-6xl mx-auto flex flex-col">{PROJECTS.map((project, i) => { const startRange = i * (1 / PROJECTS.length); const endRange = 1; return (<ProjectCard key={project.id} project={project} index={i} totalCards={PROJECTS.length} progress={scrollYProgress} range={[startRange, endRange]} />) })}</div></section>) }; const App = () => { return (<main className="w-full min-h-screen bg-[#0C0C0C] overflow-x-clip"><AtelierHeroSection /><MarqueeSection /><AboutSection /><ServicesSection /><ProjectsSection /></main>) }; const root = ReactDOM.createRoot(document.getElementById("root")); root.render(<App />);</script>
