<!DOCTYPE html>

        }

        .spinner {
            width: 32px;

            animation: spin 0.9s linear infinite;

        @keyframes spin {

            }

        a {

            margin-top: 12px;
            padding: 10px 24px;
            background: #fff;
            color: #000;

            font-size: 13px;
